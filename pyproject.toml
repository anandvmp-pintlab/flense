[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flense"
version = "0.3.0"
description = "Reverse proxy that compresses AI API payloads"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Anand", email = "anand.v@pintlab.com" }]
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "httpx[http2]>=0.27",
    "textual>=0.80",
    "tiktoken>=0.7",
    "tree-sitter>=0.23",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Tree-sitter grammars for AST-based compression. Installed explicitly rather
# than at request time. Without these, flense falls back to ctags/regex.
grammars = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
]

[project.urls]
Homepage = "https://github.com/anandvmp-pintlab/flense"
Repository = "https://github.com/anandvmp-pintlab/flense.git"
Issues = "https://github.com/anandvmp-pintlab/flense/issues"

[project.scripts]
flense = "flense.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flense"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
